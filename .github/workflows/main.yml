name: ExtNoBrasil PC Gamer - Linux Mint macOS

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC de 6 a 8 letras ou números"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: extnobrasil-pc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pc-virtual:
    name: Iniciar PC Virtual
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ========================================
      # 1. VALIDAR CONFIGURAÇÕES
      # ========================================
      - name: Validar senha
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "ERRO: use de 6 a 8 letras ou números."
            exit 1
          fi

          echo "Senha validada."

      # ========================================
      # 2. CRIAR DIRETÓRIOS
      # ========================================
      - name: Preparar diretórios
        run: |
          set -Eeuo pipefail

          mkdir -p /home/runner/mint
          mkdir -p "$RUNNER_TEMP"

      # ========================================
      # 3. RESTAURAR DISCO ANTERIOR
      # ========================================
      - name: Restaurar disco virtual
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/mint/mint.qcow2
          key: extnobrasil-mint-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            extnobrasil-mint-${{ github.ref_name }}-
            extnobrasil-mint-

      # ========================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ========================================
      - name: Instalar QEMU e noVNC
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget \
            ca-certificates \
            procps \
            lsof \
            file \
            git

          echo "Dependências instaladas."

      # ========================================
      # 5. INSTALAR CLOUDFLARED
      # ========================================
      - name: Instalar Cloudflare Tunnel
        run: |
          set -Eeuo pipefail

          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$HOME/cloudflared"

          chmod +x "$HOME/cloudflared"

          "$HOME/cloudflared" --version

      # ========================================
      # 6. BAIXAR LINUX MINT
      # ========================================
      - name: Baixar ISO
        run: |
          set -Eeuo pipefail

          ISO="/home/runner/mint/linuxmint.iso"

          if [[ ! -s "$ISO" ]]; then
            echo "Baixando Linux Mint Cinnamon..."

            curl -fL \
              --retry 3 \
              --retry-delay 3 \
              --connect-timeout 30 \
              https://pub.linuxmint.io/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso \
              -o "$ISO"
          fi

          if [[ "$(file -b "$ISO")" != *"ISO 9660"* ]]; then
            echo "ERRO: ISO inválida ou download incompleto."
            exit 1
          fi

          echo "ISO pronta."

      # ========================================
      # 7. PREPARAR DISCO
      # ========================================
      - name: Preparar disco de 145 GB
        run: |
          set -Eeuo pipefail

          DISK="/home/runner/mint/mint.qcow2"

          if [[ -s "$DISK" ]]; then
            echo "Disco restaurado."
            qemu-img info "$DISK"
          else
            echo "Criando disco virtual..."

            qemu-img create \
              -f qcow2 \
              "$DISK" \
              145G
          fi

      # ========================================
      # 8. PREPARAR SENHA VNC
      # ========================================
      - name: Preparar senha VNC
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -Eeuo pipefail

          printf '%s' "$VNC_PASSWORD" \
            > "$RUNNER_TEMP/vnc-password"

          chmod 600 "$RUNNER_TEMP/vnc-password"

      # ========================================
      # 9. INSTALADOR VISUAL MACOS
      # ========================================
      - name: Preparar instalador visual
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/mint-macos-setup.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if [[ $EUID -eq 0 ]]; then
            echo "Execute como usuário normal dentro do Linux Mint."
            exit 1
          fi

          sudo apt-get update

          sudo apt-get install -y \
            git \
            plank \
            gnome-tweaks

          cd "$HOME"

          if [[ ! -d WhiteSur-gtk-theme/.git ]]; then
            git clone --depth 1 \
              https://github.com/vinceliuice/WhiteSur-gtk-theme.git
          fi

          if [[ ! -d WhiteSur-icon-theme/.git ]]; then
            git clone --depth 1 \
              https://github.com/vinceliuice/WhiteSur-icon-theme.git
          fi

          cd "$HOME/WhiteSur-gtk-theme"
          ./install.sh -t all

          cd "$HOME/WhiteSur-icon-theme"
          ./install.sh

          mkdir -p "$HOME/.config/autostart"

          cat > "$HOME/.config/autostart/plank.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Plank Dock
          Exec=plank
          X-GNOME-Autostart-enabled=true
          DESKTOP

          echo "Tema instalada. Configure-a nas configurações do Mint."
          SCRIPT

          # Corrige a permissão de escrita no diretório do noVNC.
          sudo install -D -m 644 \
            "$RUNNER_TEMP/mint-macos-setup.sh" \
            /usr/share/novnc/mint-macos-setup.sh

          echo "Instalador visual publicado."

      # ========================================
      # 10. INICIAR PC VIRTUAL
      # ========================================
      - name: Iniciar PC Gamer
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -Eeuo pipefail

          DISK="/home/runner/mint/mint.qcow2"
          ISO="/home/runner/mint/linuxmint.iso"

          QEMU_PID=""
          VNC_PID=""
          TUNNEL_PID=""

          cleanup() {
            echo "Encerrando serviços..."

            for pid in "$TUNNEL_PID" "$VNC_PID" "$QEMU_PID"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done

            for pid in "$TUNNEL_PID" "$VNC_PID" "$QEMU_PID"; do
              if [[ -n "$pid" ]]; then
                wait "$pid" 2>/dev/null || true
              fi
            done

            rm -f "$RUNNER_TEMP/vnc-password"
          }

          trap cleanup EXIT

          # Usar poucos recursos para evitar congelamento.
          RAM_MB=4096
          CPU_COUNT=2

          if [[ -e /dev/kvm ]] &&
             [[ -r /dev/kvm ]] &&
             [[ -w /dev/kvm ]]; then
            ACCEL_ARGS=(-accel kvm)
            echo "Aceleração KVM disponível."
          else
            ACCEL_ARGS=(-accel tcg,thread=single)
            echo "KVM indisponível: emulação TCG ativada."
            echo "O desempenho gráfico poderá ser baixo."
          fi

          # Se houver disco restaurado, iniciar pelo disco.
          # Na primeira execução, iniciar pela ISO.
          if [[ "$CACHE_HIT" == "true" ]]; then
            BOOT_ORDER="c"
            echo "Inicializando pelo disco restaurado."
          else
            BOOT_ORDER="dc"
            echo "Primeira execução: inicializando pela ISO."
          fi

          # Iniciar QEMU.
          qemu-system-x86_64 \
            "${ACCEL_ARGS[@]}" \
            -machine q35 \
            -cpu max \
            -smp "$CPU_COUNT" \
            -m "$RAM_MB" \
            -drive "file=$DISK,if=virtio,format=qcow2" \
            -cdrom "$ISO" \
            -boot "order=$BOOT_ORDER" \
            -vga std \
            -display none \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 \
            -object "secret,id=vncpw,file=$RUNNER_TEMP/vnc-password" \
            -vnc "127.0.0.1:0,password-secret=vncpw" \
            > "$RUNNER_TEMP/qemu.log" 2>&1 &

          QEMU_PID=$!

          sleep 5

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "ERRO: QEMU não iniciou."
            cat "$RUNNER_TEMP/qemu.log"
            exit 1
          fi

          # Iniciar noVNC.
          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/novnc.log" 2>&1 &

          VNC_PID=$!

          sleep 3

          if ! kill -0 "$VNC_PID" 2>/dev/null; then
            echo "ERRO: noVNC não iniciou."
            cat "$RUNNER_TEMP/novnc.log"
            exit 1
          fi

          # Iniciar túnel público.
          "$HOME/cloudflared" tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &

          TUNNEL_PID=$!

          PUBLIC_URL=""

          for attempt in $(seq 1 60); do
            PUBLIC_URL="$(
              grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                "$RUNNER_TEMP/cloudflared.log" |
                head -n 1 || true
            )"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERRO: Cloudflare Tunnel encerrou."
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi

            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo "ERRO: não foi possível obter o endereço público."
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          echo
          echo "========================================"
          echo "   ExtNoBrasil PC Gamer iniciado"
          echo "========================================"
          echo "Sistema: Linux Mint Cinnamon"
          echo "RAM virtual: 4 GB"
          echo "CPU virtual: 2 núcleos"
          echo "Disco virtual: 145 GB"
          echo
          echo "ENDEREÇO DO PC:"
          echo "$PUBLIC_URL/vnc.html"
          echo
          echo "Senha VNC: a senha informada no workflow"
          echo
          echo "INSTALADOR VISUAL:"
          echo "$PUBLIC_URL/mint-macos-setup.sh"
          echo
          echo "Não compartilhe o endereço público."
          echo "========================================"

          # Monitorar o QEMU.
          # Encerra antes do limite máximo do job.
          for ((i=0; i<20700; i+=10)); do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "ERRO: QEMU encerrou."
              tail -n 100 "$RUNNER_TEMP/qemu.log" || true
              exit 1
            fi

            if ! kill -0 "$VNC_PID" 2>/dev/null; then
              echo "ERRO: noVNC encerrou."
              tail -n 100 "$RUNNER_TEMP/novnc.log" || true
              exit 1
            fi

            sleep 10
          done

          echo "Tempo de execução concluído."

      # ========================================
      # 11. SALVAR DISCO PARA PRÓXIMA EXECUÇÃO
      # ========================================
      - name: Salvar disco virtual
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/mint/mint.qcow2
          key: extnobrasil-mint-${{ github.ref_name }}-${{ github.run_id }}
