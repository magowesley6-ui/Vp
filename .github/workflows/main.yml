name: "🎮 ExtNoBrasil PC Gamer - Zorin OS [BETA]"

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha do VNC (1 a 8 letras ou números)"
        required: true
        type: string
        default: "Ext2026"

permissions:
  contents: read

concurrency:
  group: extnobrasil-pc-gamer
  cancel-in-progress: false

jobs:
  pc-virtual:
    name: "🚀 Iniciar PC Virtual"
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: "🎨 Preparar ambiente"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "       EXTNOBRASIL PC GAMER [BETA]"
          echo "=============================================="
          echo "Preparando o ambiente virtual..."

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            socat \
            curl \
            ca-certificates \
            zstd

          echo "✅ Dependências instaladas."

      - name: "🔐 Validar configurações"
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ZORIN_ISO_URL: ${{ secrets.ZORIN_ISO_URL }}
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$TAILSCALE_AUTH_KEY" ]]; then
            echo "❌ ERRO: Configure o segredo TAILSCALE_AUTH_KEY."
            exit 1
          fi

          if [[ -z "$ZORIN_ISO_URL" ]]; then
            echo "❌ ERRO: Configure o segredo ZORIN_ISO_URL."
            exit 1
          fi

          if [[ ! "$VNC_PASSWORD" =~ ^[a-zA-Z0-9]{1,8}$ ]]; then
            echo "❌ A senha precisa ter de 1 a 8 letras ou números."
            exit 1
          fi

          echo "✅ Configurações validadas."

      - name: "🌐 Conectar ao Tailscale"
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -Eeuo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="extnobrasil-pc-gamer" \
            --accept-dns=false

          for i in $(seq 1 30); do
            if sudo tailscale ip -4 2>/dev/null | grep -qE '^[0-9]'; then
              break
            fi
            sleep 2
          done

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "❌ Não foi possível obter o IP do Tailscale."
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo "✅ Tailscale conectado."
          echo "📡 IP privado: $TAILSCALE_IP"

      - name: "💿 Baixar Zorin OS"
        shell: bash
        env:
          ZORIN_ISO_URL: ${{ secrets.ZORIN_ISO_URL }}
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "              DOWNLOAD DO SISTEMA"
          echo "=============================================="

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --output zorin.iso \
            "$ZORIN_ISO_URL"

          if [[ ! -s zorin.iso ]]; then
            echo "❌ O arquivo ISO está vazio."
            exit 1
          fi

          file zorin.iso || true

          echo "✅ Download concluído."
          du -h zorin.iso

      - name: "⚙️ Configurar PC Virtual"
        shell: bash
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "        CONFIGURAÇÃO DO PC VIRTUAL"
          echo "=============================================="

          # Disco virtual de 145 GB.
          qemu-img create \
            -f qcow2 \
            zorin-disk.qcow2 \
            145G

          # Usar KVM quando estiver disponível.
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            ACCEL="kvm"
            CPU_MODEL="host"
            echo "✅ KVM disponível."
          else
            ACCEL="tcg"
            CPU_MODEL="max"
            echo "⚠️ KVM indisponível: usando emulação TCG."
            echo "A emulação pode deixar o sistema muito lento."
          fi

          echo "ACCEL=$ACCEL" >> "$GITHUB_ENV"
          echo "CPU_MODEL=$CPU_MODEL" >> "$GITHUB_ENV"

          # O runner pode não ter RAM suficiente para 6 GB.
          # 4 GB é uma configuração mais prudente.
          echo "💾 RAM virtual: 4 GB"
          echo "🧠 CPUs virtuais: 2"
          echo "💿 Disco virtual: 145 GB"
          echo "🖥️ Vídeo: adaptador VGA virtual"
          echo "🌐 Rede: QEMU user-mode"
          echo "⚙️ Aceleração: $ACCEL"

          # A senha não é impressa no log.
          printf '%s' "$VNC_PASSWORD" > "$RUNNER_TEMP/vnc-password"
          chmod 600 "$RUNNER_TEMP/vnc-password"

          echo "✅ PC Virtual configurado."

      - name: "🖥️ Iniciar QEMU e noVNC"
        shell: bash
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "         INICIANDO O PC VIRTUAL"
          echo "=============================================="

          # O monitor QEMU permite configurar a senha do VNC.
          sudo rm -f /tmp/extnobrasil-qemu-monitor.sock

          qemu-system-x86_64 \
            -name "ExtNoBrasil-PC-Gamer" \
            -machine "q35,accel=${ACCEL}" \
            -cpu "$CPU_MODEL" \
            -smp 2,sockets=1,cores=2,threads=1 \
            -m 4G \
            -drive file=zorin-disk.qcow2,format=qcow2,if=virtio \
            -drive id=cdrom,file=zorin.iso,media=cdrom,if=none,readonly=on \
            -device ide-cd,drive=cdrom,bus=ide.1 \
            -boot menu=on,order=d \
            -vga std \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0 \
            -display none \
            -monitor unix:/tmp/extnobrasil-qemu-monitor.sock,server=on,wait=off \
            -vnc 127.0.0.1:0,password=on \
            -no-reboot \
            > "$RUNNER_TEMP/qemu.log" 2>&1 &

          QEMU_PID=$!
          echo "$QEMU_PID" > "$RUNNER_TEMP/qemu.pid"

          echo "Aguardando inicialização do QEMU..."

          for i in $(seq 1 60); do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "❌ O QEMU encerrou inesperadamente."
              cat "$RUNNER_TEMP/qemu.log" || true
              exit 1
            fi

            if [[ -S /tmp/extnobrasil-qemu-monitor.sock ]]; then
              break
            fi

            sleep 2
          done

          if [[ ! -S /tmp/extnobrasil-qemu-monitor.sock ]]; then
            echo "❌ O monitor QEMU não foi iniciado."
            cat "$RUNNER_TEMP/qemu.log" || true
            exit 1
          fi

          # Configurar a senha VNC sem mostrá-la no log.
          printf 'change vnc password %s\n' "$VNC_PASSWORD" |
            socat - UNIX-CONNECT:/tmp/extnobrasil-qemu-monitor.sock \
            > "$RUNNER_TEMP/qemu-password.log" 2>&1 || true

          # Iniciar o servidor web no endereço acessível pela rede privada.
          websockify \
            --web=/usr/share/novnc/ \
            0.0.0.0:6080 \
            127.0.0.1:5900 \
            > "$RUNNER_TEMP/novnc.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/novnc.pid"

          sleep 3

          if ! kill -0 "$(cat "$RUNNER_TEMP/novnc.pid")" 2>/dev/null; then
            echo "❌ O noVNC não iniciou."
            cat "$RUNNER_TEMP/novnc.log" || true
            exit 1
          fi

          echo "✅ QEMU iniciado."
          echo "✅ noVNC iniciado."

      - name: "🏆 Créditos e informações do PC Virtual"
        shell: bash
        run: |
          set -Eeuo pipefail

          clear || true

          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║           EXT NOBRASIL PC GAMER             ║"
          echo "║                  BETA                       ║"
          echo "╚══════════════════════════════════════════════╝"
          echo ""

          echo "             || CRÉDITOS ||"
          echo ""
          echo "• Criador - ExtNoBrasil (ExT)"
          echo "• Perfil do Discord - Brasil_kill0"
          echo "• Dia De Criação - Sexta-feira 9 de outubro 2026"
          echo ""

          echo "=============================================="
          echo "     || DETALHES DO PC VIRTUAL [BETA] ||"
          echo "=============================================="
          echo ""
          echo "• Sistema: Zorin OS (ISO fornecida)"
          echo "• Virtualizador: QEMU"
          echo "• Processador: 2 CPUs virtuais"
          echo "• Memória RAM atribuída: 4 GB"
          echo "• Disco virtual: 145 GB (QCOW2)"
          echo "• Vídeo: adaptador VGA virtual"
          echo "• Aceleração: ${ACCEL}"
          echo "• Rede: QEMU user-mode"
          echo "• Acesso remoto: noVNC"
          echo "• Rede privada: Tailscale"
          echo "• Porta web: 6080"
          echo "• Porta VNC local: 5900"
          echo "• Duração máxima aproximada: 330 minutos"
          echo "• Estado: sessão temporária"
          echo ""
          echo "=============================================="
          echo "             INFORMAÇÕES IMPORTANTES"
          echo "=============================================="
          echo ""
          echo "1. O disco virtual não é salvo automaticamente"
          echo "   para a próxima execução deste workflow."
          echo ""
          echo "2. O espaço de 145 GB é virtual, não uma"
          echo "   garantia de 145 GB físicos disponíveis."
          echo ""
          echo "3. A GPU é virtual. Não há garantia de"
          echo "   aceleração 3D nem de FPS para jogos."
          echo ""
          echo "4. Para acessar pelo celular, conecte o"
          echo "   aplicativo Tailscale à mesma rede privada."
          echo ""
          echo "5. Se o sistema iniciar pelo instalador, será"
          echo "   necessário instalar o Zorin no disco virtual."
          echo ""
          echo "=============================================="
          echo "          🔗 LINK DE ACESSO NO FINAL"
          echo "=============================================="
          echo ""

          echo "=============================================="
          echo "              🔗 LINK DO NOVNC"
          echo "=============================================="
          echo ""
          echo "Acesse pelo navegador do celular:"
          echo ""
          echo "http://${TAILSCALE_IP}:6080/vnc.html?autoconnect=1&resize=scale"
          echo ""
          echo "Senha VNC: a senha informada ao iniciar o workflow."
          echo ""
          echo "⚠️ O celular precisa estar conectado ao Tailscale."
          echo ""

      - name: "⏳ Manter o PC Virtual ligado"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "          PC VIRTUAL EM EXECUÇÃO"
          echo "=============================================="
          echo "A sessão ficará ativa enquanto o workflow"
          echo "estiver executando e os serviços funcionarem."
          echo ""

          START_TIME=$(date +%s)
          MAX_SECONDS=$((330 * 60))

          while true; do
            if [[ -f "$RUNNER_TEMP/qemu.pid" ]]; then
              QEMU_PID=$(cat "$RUNNER_TEMP/qemu.pid")

              if ! kill -0 "$QEMU_PID" 2>/dev/null; then
                echo "❌ O QEMU encerrou."
                cat "$RUNNER_TEMP/qemu.log" || true
                exit 1
              fi
            fi

            ELAPSED=$(( $(date +%s) - START_TIME ))

            if (( ELAPSED >= MAX_SECONDS )); then
              echo "⏰ Tempo máximo da sessão atingido."
              break
            fi

            REMAINING=$((MAX_SECONDS - ELAPSED))
            echo "⏳ Sessão ativa. Tempo restante: $((REMAINING / 60)) minutos."

            sleep 300
          done

      - name: "🛑 Encerrar serviços"
        if: always()
        shell: bash
        run: |
          echo "Encerrando o PC Virtual..."

          if [[ -f "$RUNNER_TEMP/novnc.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/novnc.pid")" 2>/dev/null || true
          fi

          if [[ -f "$RUNNER_TEMP/qemu.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/qemu.pid")" 2>/dev/null || true
          fi

          echo ""
          echo "=============================================="
          echo "          EXT NOBRASIL PC GAMER"
          echo "=============================================="
          echo "Sessão encerrada."
          echo "O disco virtual desta execução é temporário."
          echo "=============================================="un: |
          # se voce cancelar a execucao, ja pede o desligamento na hora
          on_cancel() {
            echo "Cancelamento detectado: pedindo desligamento..."
            touch "$QEMU_DIR/powerdown_sent"
            echo system_powerdown | socat - UNIX-CONNECT:"$QEMU_DIR/monitor.sock" || true
            exit 0
          }
          trap on_cancel INT TERM

          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TS)) -ge "$MAX_SECONDS" ]; then
              echo "Perto do limite de 6h: encerrando e salvando."
              break
            fi
            pgrep -f qemu-system-x86_64 > /dev/null || { echo "VM desligada: indo salvar."; tail -n 30 "$QEMU_DIR/qemu.log" || true; break; }
            pgrep -f cloudflared > /dev/null || { echo "Tunel caiu: encerrando e salvando."; break; }
            sleep 20 & wait $!
          done

      - name: Shutdown VM safely
        if: ${{ always() && env.VM_STARTED == 'true' }}
        run: |
          if pgrep -f qemu-system-x86_64 > /dev/null; then
            if [ ! -f "$QEMU_DIR/powerdown_sent" ]; then
              echo system_powerdown | socat - UNIX-CONNECT:"$QEMU_DIR/monitor.sock" || true
            fi
            for i in $(seq 1 30); do
              pgrep -f qemu-system-x86_64 > /dev/null || break
              sleep 2
            done
            if pgrep -f qemu-system-x86_64 > /dev/null; then
              echo "Nao desligou a tempo: fechando a VM a forca."
              echo quit | socat - UNIX-CONNECT:"$QEMU_DIR/monitor.sock" || true
              sleep 5
            fi
          fi
          pkill -f websockify || true
          pgrep -f qemu-system-x86_64 > /dev/null && echo "AVISO: QEMU ainda ativo" || echo "VM parada."

      - name: Compress disk
        if: ${{ always() && env.VM_STARTED == 'true' }}
        run: |
          if pgrep -f qemu-system-x86_64 > /dev/null; then
            echo "QEMU ainda ativo: nao vou salvar pra nao corromper."
            exit 0
          fi
          mkdir -p "$SAVE_DIR"
          rm -f "$SAVE_DIR/zorin.qcow2.zst"
          # recria o qcow2 so com o que esta em uso (ignora o espaco vazio)
          qemu-img convert -f qcow2 -O qcow2 -o cluster_size=1M \
            "$QEMU_DIR/zorin.qcow2" "$QEMU_DIR/zorin-compact.qcow2"
          zstd -T0 -1 -f "$QEMU_DIR/zorin-compact.qcow2" -o "$SAVE_DIR/zorin.qcow2.zst"
          stat -c%s "$QEMU_DIR/zorin-compact.qcow2" > "$SAVE_DIR/zorin.size"
          ls -lh "$SAVE_DIR/zorin.qcow2.zst"
          SIZE=$(stat -c%s "$SAVE_DIR/zorin.qcow2.zst")
          if [ "$SIZE" -gt 9800000000 ]; then
            echo "ERRO: save com $((SIZE/1000000)) MB passa do limite de 10 GB do cache. Nao vou salvar."
            exit 0
          fi
          echo "SAVE_READY=true" >> "$GITHUB_ENV"

      - name: Save to cache
        id: save
        if: ${{ always() && env.SAVE_READY == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/zorin-save
          key: zorin-disk-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete older saves
        if: ${{ always() && steps.save.outcome == 'success' }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key zorin-disk- \
            --sort created_at --order desc --limit 50 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
          echo "Save concluido."
