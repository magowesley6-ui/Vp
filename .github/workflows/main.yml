name: ExtNoBrasil PC - Garuda Linux (noVNC + Salvamento)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha do VNC (até 8 caracteres)"
        required: true
      edition:
        description: "Edição do Garuda (mokka = o visual da sua foto; xfce é a mais leve)"
        type: choice
        options:
          - mokka
          - xfce
          - kde-lite
          - dr460nized
          - gnome
          - cinnamon
          - dr460nized-gaming
        default: mokka
      fresh_install:
        description: "Começar do zero (ignora o save anterior)?"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  garuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DISK: 80G
      ISO_URL: https://iso.builds.garudalinux.org/iso/latest/garuda/${{ inputs.edition }}/latest.iso
      VNC_PASS: ${{ inputs.vnc_password }}
      GH_TOKEN: ${{ github.token }}
      MAX_SECONDS: 19500

    steps:
      # 1. Pacotes
      - name: Install packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          echo "::add-mask::$VNC_PASS"
          [ -n "$VNC_PASS" ] || { echo "ERRO: informe a senha do VNC"; exit 1; }
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils novnc websockify aria2 curl wget \
            ca-certificates zstd socat
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O "$HOME/cloudflared"
          chmod +x "$HOME/cloudflared"

      # 2. Restaura o disco salvo (se existir)
      - name: Restore saved Garuda disk
        id: restore
        if: ${{ !inputs.fresh_install }}
        uses: actions/cache/restore@v4
        with:
          path: ~/garuda-save
          key: garuda-disk-nomatch-${{ github.run_id }}
          restore-keys: |
            garuda-disk-

      # 3. KVM, ISO e disco
      - name: Prepare disk, KVM and ISO
        run: |
          set -e
          mkdir -p "$HOME/garuda" "$HOME/garuda-save"

          # libera espaço em segundo plano
          ( sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost >/dev/null 2>&1 ) &
          CLEAN_PID=$!

          # KVM
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_OPT=host" >> "$GITHUB_ENV"
            echo "KVM disponível."
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_OPT=max" >> "$GITHUB_ENV"
            echo "AVISO: sem KVM (repositório privado). Vai ficar lento. Deixe o repo PÚBLICO."
          fi

          # ISO
          aria2c -x 4 -s 4 -k 1M --console-log-level=warn \
            -d "$HOME/garuda" -o garuda.iso "$ISO_URL" \
            || wget -q -O "$HOME/garuda/garuda.iso" "$ISO_URL"
          SIZE=$(stat -c%s "$HOME/garuda/garuda.iso")
          [ "$SIZE" -gt 1000000000 ] || { echo "ERRO: ISO incompleta ($SIZE bytes)"; exit 1; }

          wait "$CLEAN_PID" || true
          df -h / | tail -1

          # swap extra no host (evita o runner matar a VM por falta de memória)
          sudo fallocate -l 8G /swapfile-extra \
            && sudo chmod 600 /swapfile-extra \
            && sudo mkswap /swapfile-extra >/dev/null \
            && sudo swapon /swapfile-extra || true

          # ajustes do host
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled >/dev/null || true
          sudo sysctl -qw vm.swappiness=10 vm.dirty_ratio=40 vm.dirty_background_ratio=10 || true

          # disco: restaura o salvo (se for seguro) ou cria um novo
          ZST="$HOME/garuda-save/garuda.qcow2.zst"
          SZ_FILE="$HOME/garuda-save/garuda.size"
          RESTORE_OK=false
          if [ -f "$ZST" ]; then
            if [ -f "$SZ_FILE" ]; then
              NEED=$(cat "$SZ_FILE")
              AVAIL=$(df --output=avail -B1 / | tail -1)
              if [ "$NEED" -lt $((AVAIL - 15000000000)) ]; then
                RESTORE_OK=true
              else
                echo "Save grande demais pro espaço livre ($((NEED/1000000)) MB): ignorando."
              fi
            else
              echo "Save antigo (formato incompatível, lotaria o disco): ignorando."
            fi
          fi

          if [ "$RESTORE_OK" = true ]; then
            echo "Save encontrado ($(du -h "$ZST" | cut -f1)): restaurando disco..."
            START_R=$(date +%s)
            zstd -d --rm -f "$ZST" -o "$HOME/garuda/garuda.qcow2"
            echo "Disco restaurado em $(( $(date +%s) - START_R ))s"
            echo "RESTORED=true" >> "$GITHUB_ENV"
          else
            rm -rf "$HOME/garuda-save"/*
            echo "Criando disco novo."
            qemu-img create -f qcow2 -o lazy_refcounts=on,cluster_size=1M \
              "$HOME/garuda/garuda.qcow2" "$DISK"
            echo "RESTORED=false" >> "$GITHUB_ENV"
          fi
          ls -lh "$HOME/garuda/garuda.qcow2"

      # 4. Launcher QEMU
      - name: Create QEMU launcher
        run: |
          AVAIL_MB=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
          VM_RAM_MB=$((AVAIL_MB - 1024))
          [ "$VM_RAM_MB" -gt 15360 ] && VM_RAM_MB=15360
          [ "$VM_RAM_MB" -lt 1536 ] && VM_RAM_MB=1536
          VM_CPUS=$(nproc)
          echo "VM_RAM_MB=$VM_RAM_MB" >> "$GITHUB_ENV"
          echo "VM_CPUS=$VM_CPUS" >> "$GITHUB_ENV"
          echo "RAM livre: ${AVAIL_MB} MB -> VM com ${VM_RAM_MB} MB, ${VM_CPUS} CPUs"

          cat > "$HOME/garuda/start-garuda.sh" <<EOF
          #!/usr/bin/env bash
          exec qemu-system-x86_64 \\
            -machine q35 \\
            -accel ${ACCEL} \\
            -cpu ${CPU_OPT} \\
            -smp ${VM_CPUS} \\
            -m ${VM_RAM_MB}M \\
            -object iothread,id=io0 \\
            -drive file=$HOME/garuda/garuda.qcow2,if=none,id=hd0,format=qcow2,cache=writeback,aio=threads,discard=unmap,l2-cache-size=32M \\
            -device virtio-blk-pci,drive=hd0,iothread=io0,num-queues=${VM_CPUS} \\
            -cdrom $HOME/garuda/garuda.iso \\
            -boot order=cd,menu=off \\
            -vga std \\
            -device qemu-xhci -device usb-tablet \\
            -object secret,id=vncpw,data=\${VNC_PASS} \\
            -vnc 127.0.0.1:0,password-secret=vncpw \\
            -monitor unix:$HOME/garuda/monitor.sock,server,nowait \\
            -netdev user,id=net0 \\
            -device virtio-net-pci,netdev=net0 \\
            -device virtio-balloon-pci \\
            -rtc base=localtime
          EOF
          chmod +x "$HOME/garuda/start-garuda.sh"

      # 5. Inicia a VM
      - name: Start Garuda VM
        run: |
          nohup "$HOME/garuda/start-garuda.sh" > "$HOME/garuda/qemu.log" 2>&1 &
          echo "VM_STARTED=true" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            sleep 2
            ss -ltn | grep -q "127.0.0.1:5900" && break
          done
          if ! pgrep -f qemu-system-x86_64 >/dev/null || ! ss -ltn | grep -q "127.0.0.1:5900"; then
            echo "ERRO: QEMU não iniciou"
            cat "$HOME/garuda/qemu.log"
            exit 1
          fi
          echo "VM online."

      # 6. noVNC + link
      - name: Start noVNC and tunnel
        run: |
          nohup websockify --web=/usr/share/novnc/ 127.0.0.1:6080 127.0.0.1:5900 \
            > "$HOME/garuda/novnc.log" 2>&1 &
          sleep 3
          nohup "$HOME/cloudflared" tunnel --url http://127.0.0.1:6080 --no-autoupdate \
            > "$HOME/garuda/cloudflare.log" 2>&1 &

          URL=""
          for i in $(seq 1 40); do
            sleep 2
            URL="$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$HOME/garuda/cloudflare.log" | grep -v '^https://api\.' | tail -n1)"
            if [ -n "$URL" ] && grep -q "Registered tunnel connection" "$HOME/garuda/cloudflare.log"; then
              break
            fi
          done
          [ -n "$URL" ] || { echo "ERRO: link do Cloudflare não gerado"; cat "$HOME/garuda/cloudflare.log"; exit 1; }

          # espera o link responder de fato (o DNS do Cloudflare demora uns segundos)
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/vnc.html" || true)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "Teste do link: HTTP $CODE"
          echo "NOVNC_URL=$URL" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "  EXT NOBRASIL PC - GARUDA LINUX"
          echo "  Abra: $URL/vnc.html"
          echo "  Senha: a que você digitou ao rodar"
          echo "  ${VM_CPUS} vCPU | ${VM_RAM_MB} MB RAM | ${DISK} disco | ${ACCEL%%,*}"
          echo "  Disco restaurado do save: ${RESTORED}"
          echo "  PRA SALVAR: desligue o Garuda por dentro (menu > Sair > Desligar)."
          echo "=============================================="

      # 7. Mantém online até desligar, cair ou chegar perto do limite
      - name: Keep alive
        run: |
          # se você cancelar a execução, já pede o desligamento do Garuda na hora
          on_cancel() {
            echo "Cancelamento detectado: pedindo desligamento ao Garuda..."
            touch "$HOME/garuda/powerdown_sent"
            echo system_powerdown | socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
            exit 0
          }
          trap on_cancel INT TERM

          COUNT=0
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TS)) -ge "$MAX_SECONDS" ]; then
              echo "Perto do limite de 6h: encerrando e salvando."
              break
            fi
            pgrep -f qemu-system-x86_64 >/dev/null || { echo "VM desligada: indo salvar."; break; }
            pgrep -f cloudflared >/dev/null || { echo "Túnel caiu: encerrando e salvando."; break; }
            if [ $((COUNT % 15)) -eq 0 ]; then
              echo "[$(date '+%H:%M:%S')] online - $NOVNC_URL/vnc.html | aceleração: ${ACCEL%%,*} | CPU do QEMU: $(ps -o %cpu= -C qemu-system-x86_64 | head -1)%"
            fi
            COUNT=$((COUNT + 1))
            sleep 20 & wait $!
          done

      # 8. Desliga a VM com segurança (também roda se você cancelar)
      - name: Shutdown VM safely
        if: always() && env.VM_STARTED == 'true'
        run: |
          if pgrep -f qemu-system-x86_64 >/dev/null; then
            if [ ! -f "$HOME/garuda/powerdown_sent" ]; then
              echo "Pedindo desligamento ao Garuda..."
              echo system_powerdown | socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
            fi
            for i in $(seq 1 30); do
              pgrep -f qemu-system-x86_64 >/dev/null || break
              sleep 2
            done
            if pgrep -f qemu-system-x86_64 >/dev/null; then
              echo "Garuda não desligou a tempo: fechando a VM à força."
              echo quit | socat - UNIX-CONNECT:"$HOME/garuda/monitor.sock" || true
              sleep 5
            fi
          fi
          pgrep -f qemu-system-x86_64 >/dev/null && echo "AVISO: QEMU ainda ativo" || echo "VM parada."

      # 9. Compacta o disco
      - name: Compress disk
        if: always() && env.VM_STARTED == 'true'
        run: |
          if pgrep -f qemu-system-x86_64 >/dev/null; then
            echo "QEMU ainda ativo: não vou salvar pra não corromper."
            exit 0
          fi
          mkdir -p "$HOME/garuda-save"
          rm -f "$HOME/garuda-save/garuda.qcow2.zst"
          # recria o qcow2 só com o que está em uso (ignora o espaço vazio de 450 GB)
          qemu-img convert -f qcow2 -O qcow2 -o cluster_size=1M \
            "$HOME/garuda/garuda.qcow2" "$HOME/garuda/garuda-compact.qcow2"
          ls -lh "$HOME/garuda/garuda-compact.qcow2"
          zstd -T0 -1 -f "$HOME/garuda/garuda-compact.qcow2" -o "$HOME/garuda-save/garuda.qcow2.zst"
          stat -c%s "$HOME/garuda/garuda-compact.qcow2" > "$HOME/garuda-save/garuda.size"
          ls -lh "$HOME/garuda-save/garuda.qcow2.zst"
          SIZE=$(stat -c%s "$HOME/garuda-save/garuda.qcow2.zst")
          if [ "$SIZE" -gt 9800000000 ]; then
            echo "ERRO: save com $((SIZE/1000000)) MB passa do limite de 10 GB do cache. Não vou salvar."
            exit 0
          fi
          echo "SAVE_READY=true" >> "$GITHUB_ENV"

      # 10. Salva no cache do GitHub
      - name: Save disk to cache
        id: save
        if: always() && env.SAVE_READY == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/garuda-save
          key: garuda-disk-${{ github.run_id }}-${{ github.run_attempt }}

      # 11. Apaga saves antigos (mantém só o mais novo)
      - name: Delete older saves
        if: always() && steps.save.outcome == 'success'
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key garuda-disk- \
            --sort created_at --order desc --limit 50 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
          echo "Save concluído."
          
