name: ExtNoBrasil PC Gamer [BETA] - Lingmo OS

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC de 6 a 8 caracteres"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: extnobrasil-pc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pc-virtual:
    name: ExtNoBrasil PC Gamer - Lingmo OS
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      VM_NAME: "ExtNoBrasil PC Gamer [BETA]"
      VM_DISK: /home/runner/lingmo/lingmo.qcow2
      VM_DISK_SIZE: 145G
      SAVE_DIR: /home/runner/lingmo-save
      LINGMO_DIR: /home/runner/lingmo
      VNC_PASSWORD: ${{ inputs.vnc_password }}

    steps:
      # ==========================================
      # 1. PREPARAR O AMBIENTE
      # ==========================================

      - name: Preparar ambiente
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "   EXT NOBRASIL PC GAMER [BETA]"
          echo "             LINGMO OS"
          echo "=========================================="

          if [[ ! "$VNC_PASSWORD" =~ ^[A-Za-z0-9]{6,8}$ ]]; then
            echo "ERRO: a senha precisa ter de 6 a 8 letras ou numeros."
            exit 1
          fi

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            zstd \
            curl \
            wget \
            ca-certificates \
            procps \
            lsof \
            jq

          mkdir -p "$LINGMO_DIR"
          mkdir -p "$SAVE_DIR"

          echo "Ambiente preparado."

      # ==========================================
      # 2. DETECTAR CPU, RAM E KVM
      # ==========================================

      - name: Detectar recursos
        shell: bash
        run: |
          set -Eeuo pipefail

          CPU_HOST="$(nproc)"
          RAM_HOST="$(awk '/MemTotal/ {printf "%d", $2/1024}' /proc/meminfo)"

          if [[ "$CPU_HOST" -lt 2 ]]; then
            VM_CPU=1
          elif [[ "$CPU_HOST" -gt 4 ]]; then
            VM_CPU=4
          else
            VM_CPU="$CPU_HOST"
          fi

          VM_RAM=$((RAM_HOST - 2048))

          if [[ "$VM_RAM" -gt 4096 ]]; then
            VM_RAM=4096
          fi

          if [[ "$VM_RAM" -lt 1024 ]]; then
            VM_RAM=1024
          fi

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            ACCEL=kvm
          else
            ACCEL=tcg
          fi

          echo "VM_CPU=$VM_CPU" >> "$GITHUB_ENV"
          echo "VM_RAM=$VM_RAM" >> "$GITHUB_ENV"
          echo "ACCEL=$ACCEL" >> "$GITHUB_ENV"

          echo "CPU virtual: $VM_CPU"
          echo "RAM virtual: ${VM_RAM} MB"
          echo "Aceleracao: $ACCEL"

      # ==========================================
      # 3. RESTAURAR BACKUP
      # ==========================================

      - name: Restaurar disco salvo
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/lingmo-save
          key: extnobrasil-lingmo-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            extnobrasil-lingmo-${{ github.ref_name }}-
            extnobrasil-lingmo-

      - name: Preparar disco virtual
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LINGMO_DIR"
          mkdir -p "$SAVE_DIR"

          if [[ -f "$SAVE_DIR/lingmo.qcow2.zst" ]]; then
            echo "Backup encontrado. Restaurando disco..."

            zstd -d -f \
              "$SAVE_DIR/lingmo.qcow2.zst" \
              -o "$VM_DISK"

            echo "RESTORED=true" >> "$GITHUB_ENV"

          elif [[ -f "$SAVE_DIR/lingmo.qcow2" ]]; then
            cp "$SAVE_DIR/lingmo.qcow2" "$VM_DISK"

            echo "RESTORED=true" >> "$GITHUB_ENV"

          else
            echo "Criando disco virtual de 145 GB..."

            qemu-img create \
              -f qcow2 \
              "$VM_DISK" \
              "$VM_DISK_SIZE"

            echo "RESTORED=false" >> "$GITHUB_ENV"
          fi

          qemu-img info "$VM_DISK"

      # ==========================================
      # 4. BAIXAR LINGMO OS
      # ==========================================

      - name: Baixar ISO do Lingmo OS
        shell: bash
        run: |
          set -Eeuo pipefail

          ISO_URL="https://sourceforge.net/projects/lingmo-os/files/release/iso/helium/3.0.5/lingmo-os-3.0.5-25R06-desktop-amd64.iso/download"
          ISO_FILE="$LINGMO_DIR/lingmo.iso"

          echo "Baixando Lingmo OS 3.0.5..."

          if ! curl -fL \
            --retry 3 \
            --connect-timeout 30 \
            --output "$ISO_FILE" \
            "$ISO_URL"; then

            echo "ERRO: nao foi possivel baixar a ISO."
            echo "Confira os arquivos na pagina oficial do SourceForge."
            exit 1
          fi

          if [[ ! -s "$ISO_FILE" ]]; then
            echo "ERRO: a ISO esta vazia."
            exit 1
          fi

          FILE_TYPE="$(file -b "$ISO_FILE" 2>/dev/null || true)"

          if [[ "$FILE_TYPE" == *HTML* ]]; then
            echo "ERRO: o download retornou uma pagina HTML, nao a ISO."
            exit 1
          fi

          echo "ISO baixada."
          ls -lh "$ISO_FILE"

      # ==========================================
      # 5. CONFIGURAR SENHA VNC
      # ==========================================

      - name: Preparar senha VNC
        shell: bash
        run: |
          set -Eeuo pipefail

          printf '%s' "$VNC_PASSWORD" > "$RUNNER_TEMP/vnc-password"
          chmod 600 "$RUNNER_TEMP/vnc-password"

          echo "Senha VNC configurada."

      # ==========================================
      # 6. INICIAR QEMU
      # ==========================================

      - name: Iniciar Lingmo OS
        shell: bash
        run: |
          set -Eeuo pipefail

          SECRET_FILE="$RUNNER_TEMP/vnc-password"

          if [[ "$RESTORED" == "true" ]]; then
            echo "Iniciando pelo disco restaurado."
            BOOT_ORDER=c
          else
            echo "Iniciando pela ISO do Lingmo OS."
            BOOT_ORDER=dc
          fi

          QEMU_BIN="$(command -v qemu-system-x86_64)"

          QEMU_ARGS=(
            -name "$VM_NAME"
            -machine q35
            -cpu max
            -smp "$VM_CPU"
            -m "$VM_RAM"
            -object "secret,id=vncpw,file=$SECRET_FILE"
            -vnc "127.0.0.1:0,password-secret=vncpw"
            -device virtio-vga
            -device virtio-keyboard
            -device virtio-mouse
            -drive "file=$VM_DISK,if=virtio,format=qcow2"
            -boot "order=$BOOT_ORDER"
            -netdev user,id=net0
            -device virtio-net-pci,netdev=net0
            -rtc base=utc
            -no-reboot
          )

          if [[ "$ACCEL" == "kvm" ]]; then
            QEMU_ARGS+=(-enable-kvm)
          else
            QEMU_ARGS+=(-accel tcg,thread=multi)
          fi

          if [[ "$BOOT_ORDER" == "dc" ]]; then
            QEMU_ARGS+=(
              -drive "file=$LINGMO_DIR/lingmo.iso,media=cdrom,readonly=on"
            )
          fi

          nohup "$QEMU_BIN" "${QEMU_ARGS[@]}" \
            > "$LINGMO_DIR/qemu.log" 2>&1 &

          QEMU_PID=$!
          echo "$QEMU_PID" > "$LINGMO_DIR/qemu.pid"

          sleep 5

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "ERRO: QEMU encerrou inesperadamente."
            cat "$LINGMO_DIR/qemu.log"
            exit 1
          fi

          echo "VM_STARTED=true" >> "$GITHUB_ENV"

          echo "Lingmo OS iniciado."

      # ==========================================
      # 7. INICIAR NOVNC
      # ==========================================

      - name: Iniciar noVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > "$LINGMO_DIR/novnc.log" 2>&1 &

          echo $! > "$LINGMO_DIR/novnc.pid"

          sleep 3

          if ! curl -fsS http://127.0.0.1:6080/ >/dev/null; then
            echo "ERRO: noVNC nao iniciou."
            cat "$LINGMO_DIR/novnc.log"
            exit 1
          fi

          echo "noVNC funcionando."

      # ==========================================
      # 8. INSTALAR CLOUDFLARE TUNNEL
      # ==========================================

      - name: Instalar Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              CF_ARCH=amd64
              ;;
            arm64)
              CF_ARCH=arm64
              ;;
            *)
              echo "Arquitetura nao suportada: $ARCH"
              exit 1
              ;;
          esac

          curl -fL \
            --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CF_ARCH}" \
            -o "$RUNNER_TEMP/cloudflared"

          chmod +x "$RUNNER_TEMP/cloudflared"

          "$RUNNER_TEMP/cloudflared" --version

      # ==========================================
      # 9. ABRIR ACESSO REMOTO
      # ==========================================

      - name: Criar tunel remoto
        shell: bash
        run: |
          set -Eeuo pipefail

          nohup "$RUNNER_TEMP/cloudflared" tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > "$LINGMO_DIR/cloudflared.log" 2>&1 &

          echo $! > "$LINGMO_DIR/cloudflared.pid"

          PUBLIC_URL=""

          echo "Aguardando endereco publico..."

          for i in $(seq 1 60); do
            PUBLIC_URL="$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$LINGMO_DIR/cloudflared.log" \
                | head -n 1 || true
            )"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo "ERRO: o tunel Cloudflare nao iniciou."
            cat "$LINGMO_DIR/cloudflared.log"
            exit 1
          fi

          echo "=========================================="
          echo "       EXT NOBRASIL PC GAMER [BETA]"
          echo "=========================================="
          echo ""
          echo "|| CREDITOS ||"
          echo "Criador: ExtNoBrasil (ExT)"
          echo "Perfil do Discord: Brasil_kill0"
          echo "Data de criacao: 9 de outubro de 2026"
          echo ""
          echo "|| DETALHES DO PC VIRTUAL ||"
          echo "Sistema: Lingmo OS 3.0.5"
          echo "CPU virtual: $VM_CPU vCPU"
          echo "RAM virtual: ${VM_RAM} MB"
          echo "Disco virtual: 145 GB"
          echo "Aceleracao: $ACCEL"
          echo "Interface: noVNC"
          echo "Rede: Cloudflare Tunnel"
          echo ""
          echo "|| ACESSO AO PC ||"
          echo "$PUBLIC_URL/vnc.html?autoconnect=true&resize=scale"
          echo ""
          echo "Senha VNC: a senha definida ao iniciar o workflow."
          echo ""
          echo "Nao compartilhe o endereco publico."
          echo "=========================================="

      # ==========================================
      # 10. MANTER O PC LIGADO
      # ==========================================

      - name: Manter PC virtual ativo
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "PC virtual em funcionamento."

          for i in $(seq 1 20700); do
            if [[ -f "$LINGMO_DIR/qemu.pid" ]]; then
              QEMU_PID="$(cat "$LINGMO_DIR/qemu.pid")"

              if ! kill -0 "$QEMU_PID" 2>/dev/null; then
                echo "QEMU encerrou."
                cat "$LINGMO_DIR/qemu.log" || true
                break
              fi
            fi

            sleep 1
          done

          echo "Sessao finalizada."

      # ==========================================
      # 11. PREPARAR BACKUP
      # ==========================================

      - name: Preparar backup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$SAVE_DIR"

          if [[ -f "$LINGMO_DIR/qemu.pid" ]]; then
            QEMU_PID="$(cat "$LINGMO_DIR/qemu.pid")"

            if kill -0 "$QEMU_PID" 2>/dev/null; then
              kill -TERM "$QEMU_PID" 2>/dev/null || true

              for i in $(seq 1 30); do
                if ! kill -0 "$QEMU_PID" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              if kill -0 "$QEMU_PID" 2>/dev/null; then
                kill -KILL "$QEMU_PID" 2>/dev/null || true
              fi
            fi
          fi

          for PID_FILE in \
            "$LINGMO_DIR/cloudflared.pid" \
            "$LINGMO_DIR/novnc.pid"; do

            if [[ -f "$PID_FILE" ]]; then
              kill "$(cat "$PID_FILE")" 2>/dev/null || true
            fi
          done

          if [[ -f "$VM_DISK" ]]; then
            echo "Compactando disco..."

            if zstd -T0 -3 -f \
              "$VM_DISK" \
              -o "$SAVE_DIR/lingmo.qcow2.zst"; then

              echo "SAVE_READY=true" >> "$GITHUB_ENV"

              echo "Backup preparado."
              ls -lh "$SAVE_DIR/lingmo.qcow2.zst"
            else
              echo "SAVE_READY=false" >> "$GITHUB_ENV"
              echo "ERRO: falha ao compactar disco."
              exit 1
            fi
          else
            echo "SAVE_READY=false" >> "$GITHUB_ENV"
            echo "Disco nao encontrado."
          fi

      # ==========================================
      # 12. SALVAR CACHE
      # ==========================================

      - name: Salvar disco no cache
        if: always() && env.SAVE_READY == 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/lingmo-save
          key: extnobrasil-lingmo-${{ github.ref_name }}-${{ github.run_id }}

      # ==========================================
      # 13. DIAGNOSTICO
      # ==========================================

      - name: Mostrar logs em caso de erro
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "       DIAGNOSTICO EXT NOBRASIL"
          echo "=========================================="

          for LOG_FILE in \
            "$LINGMO_DIR/qemu.log" \
            "$LINGMO_DIR/novnc.log" \
            "$LINGMO_DIR/cloudflared.log"; do

            if [[ -f "$LOG_FILE" ]]; then
              echo ""
              echo "---- $LOG_FILE ----"
              tail -n 80 "$LOG_FILE" || true
            fi
          done
