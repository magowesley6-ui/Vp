name: ZorinOS Gamer PC (High Performance)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "Senha VNC (6-8 chars)"
        required: true
      fresh_install:
        description: "Instalacao nova (ignora o save)?"
        type: boolean
        default: false
      target_fps:
        description: "Foco de otimizacao"
        type: choice
        options:
          - max_fps
          - balanced
        default: max_fps

permissions:
  contents: read
  actions: write

jobs:
  zorin-gamer-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DISK_SIZE: 80G
      VNC_PASS: ${{ inputs.vnc_password }}
      GH_TOKEN: ${{ github.token }}
      TARGET_FPS: ${{ inputs.target_fps }}
      QEMU_DIR: /home/runner/zorin-vm
      SAVE_DIR: /home/runner/zorin-save
      MAX_SECONDS: 19500

    steps:
      - name: Install packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          if [ "${#VNC_PASS}" -lt 6 ]; then
            echo "ERRO: a senha recebida tem ${#VNC_PASS} caracteres; precisa ter de 6 a 8."
            exit 1
          fi
          echo "::add-mask::$VNC_PASS"
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils novnc websockify aria2 curl wget \
            ca-certificates zstd socat
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /home/runner/cloudflared
          chmod +x /home/runner/cloudflared

      - name: Restore saved disk
        id: restore
        if: ${{ !inputs.fresh_install }}
        uses: actions/cache/restore@v4
        with:
          path: ~/zorin-save
          key: zorin-disk-nomatch-${{ github.run_id }}
          restore-keys: |
            zorin-disk-

      - name: Prepare disk and KVM
        run: |
          set -e
          mkdir -p "$QEMU_DIR" "$SAVE_DIR"

          # libera espaco (apaga ferramentas pre-instaladas do runner)
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost >/dev/null 2>&1 || true
          df -h / | tail -1

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then
            echo "ACCEL=kvm" >> "$GITHUB_ENV"
            echo "CPU_OPT=host" >> "$GITHUB_ENV"
            echo "KVM disponivel."
          else
            echo "ACCEL=tcg,thread=multi" >> "$GITHUB_ENV"
            echo "CPU_OPT=max" >> "$GITHUB_ENV"
            echo "AVISO: sem KVM (repositorio privado). Vai ficar lento. Deixe o repo PUBLICO."
          fi

          # Video: placa VGA padrao (a mais compativel; sem GPU fisica nao ha aceleracao 3D)
          echo "GPU_ARGS=-vga std" >> "$GITHUB_ENV"

          # swap extra no host (evita o runner matar a VM por falta de memoria)
          sudo fallocate -l 8G /swapfile-extra \
            && sudo chmod 600 /swapfile-extra \
            && sudo mkswap /swapfile-extra >/dev/null \
            && sudo swapon /swapfile-extra || true

          # ajustes do host
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled >/dev/null || true
          sudo sysctl -qw vm.swappiness=10 vm.dirty_ratio=40 vm.dirty_background_ratio=10 || true

          # disco: restaura o salvo (se for seguro) ou cria um novo
          ZST="$SAVE_DIR/zorin.qcow2.zst"
          SZ_FILE="$SAVE_DIR/zorin.size"
          RESTORE_OK=false
          if [ -f "$ZST" ]; then
            if [ -f "$SZ_FILE" ]; then
              NEED=$(cat "$SZ_FILE")
              AVAIL=$(df --output=avail -B1 / | tail -1)
              if [ "$NEED" -lt $((AVAIL - 15000000000)) ]; then
                RESTORE_OK=true
              else
                echo "Save grande demais pro espaco livre: ignorando."
              fi
            else
              echo "Save antigo (formato incompativel, lotaria o disco): ignorando."
            fi
          fi

          if [ "$RESTORE_OK" = true ]; then
            echo "Restaurando disco salvo..."
            zstd -d --rm -f "$ZST" -o "$QEMU_DIR/zorin.qcow2"
            echo "RESTORED=true" >> "$GITHUB_ENV"
          else
            rm -rf "$SAVE_DIR"/*
            qemu-img create -f qcow2 -o lazy_refcounts=on,cluster_size=1M "$QEMU_DIR/zorin.qcow2" "$DISK_SIZE"
            echo "RESTORED=false" >> "$GITHUB_ENV"
          fi
          ls -lh "$QEMU_DIR/zorin.qcow2"

      - name: Download Zorin ISO
        run: |
          set -e
          # tenta 18.1 e depois 18 (para o visual Core, troque Lite por Core)
          URLS="https://distro.ibiblio.org/zorinos/18/Zorin-OS-18.1-Lite-64-bit.iso https://distro.ibiblio.org/zorinos/18/Zorin-OS-18-Lite-64-bit.iso"
          ISO_OK=false
          for U in $URLS; do
            echo "Baixando $U"
            rm -f "$QEMU_DIR/zorin.iso"
            aria2c -x 4 -s 4 -k 1M --console-log-level=warn \
              -d "$QEMU_DIR" -o zorin.iso "$U" || true
            SIZE=$(stat -c%s "$QEMU_DIR/zorin.iso" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000000000 ]; then ISO_OK=true; break; fi
            echo "Falhou (tamanho: $SIZE). Tentando o proximo link..."
          done
          [ "$ISO_OK" = true ] || { echo "ERRO: nao consegui baixar a ISO"; exit 1; }

      - name: Create QEMU Launcher
        run: |
          AVAIL_MB=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
          if [ "$TARGET_FPS" = "max_fps" ]; then
            VM_RAM_MB=$((AVAIL_MB - 1024))
          else
            VM_RAM_MB=$((AVAIL_MB - 2048))
          fi
          [ "$VM_RAM_MB" -gt 15360 ] && VM_RAM_MB=15360
          [ "$VM_RAM_MB" -lt 1536 ] && VM_RAM_MB=1536

          VM_CPUS=$(nproc)

          echo "VM_RAM_MB=$VM_RAM_MB" >> "$GITHUB_ENV"
          echo "VM_CPUS=$VM_CPUS" >> "$GITHUB_ENV"
          echo "VM com ${VM_RAM_MB} MB e ${VM_CPUS} CPUs"

          cat > "$QEMU_DIR/start.sh" <<EOF
          #!/usr/bin/env bash
          exec qemu-system-x86_64 \\
            -machine q35 \\
            -accel ${ACCEL} \\
            -cpu ${CPU_OPT} \\
            -smp ${VM_CPUS} \\
            -m ${VM_RAM_MB}M \\
            -object iothread,id=io0 \\
            -drive file=$QEMU_DIR/zorin.qcow2,if=none,id=hd0,format=qcow2,cache=writeback,aio=threads,discard=unmap,l2-cache-size=32M \\
            -device virtio-blk-pci,drive=hd0,iothread=io0,num-queues=${VM_CPUS} \\
            -cdrom $QEMU_DIR/zorin.iso \\
            -boot order=cd,menu=off \\
            ${GPU_ARGS} \\
            -device qemu-xhci -device usb-tablet \\
            -object secret,id=vncpw,data=\${VNC_PASS} \\
            -vnc 127.0.0.1:0,password-secret=vncpw \\
            -monitor unix:$QEMU_DIR/monitor.sock,server,nowait \\
            -netdev user,id=net0 \\
            -device virtio-net-pci,netdev=net0 \\
            -device virtio-balloon-pci \\
            -device virtio-rng-pci \\
            -rtc base=localtime
          EOF
          chmod +x "$QEMU_DIR/start.sh"

      - name: Start VM
        run: |
          nohup "$QEMU_DIR/start.sh" > "$QEMU_DIR/qemu.log" 2>&1 &
          echo "VM_STARTED=true" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            sleep 2
            if ss -ltn | grep -q "127.0.0.1:5900"; then
              echo "VNC pronto."
              break
            fi
          done
          if ! pgrep -f qemu-system-x86_64 > /dev/null || ! ss -ltn | grep -q "127.0.0.1:5900"; then
            echo "ERRO: QEMU nao iniciou."
            cat "$QEMU_DIR/qemu.log"
            exit 1
          fi
          nohup websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900 > "$QEMU_DIR/novnc.log" 2>&1 &
          sleep 3

      - name: Start tunnel
        run: |
          nohup /home/runner/cloudflared tunnel --url http://127.0.0.1:6080 --no-autoupdate \
            > "$QEMU_DIR/cloudflare.log" 2>&1 &

          URL=""
          for i in $(seq 1 40); do
            sleep 2
            URL="$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' "$QEMU_DIR/cloudflare.log" | grep -v '^https://api\.' | tail -n1)"
            if [ -n "$URL" ] && grep -q "Registered tunnel connection" "$QEMU_DIR/cloudflare.log"; then
              break
            fi
          done
          [ -n "$URL" ] || { echo "ERRO: link nao gerado"; cat "$QEMU_DIR/cloudflare.log"; exit 1; }

          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/vnc.html" || true)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "Teste do link: HTTP $CODE"
          echo "NOVNC_URL=$URL" >> "$GITHUB_ENV"

          # link reserva (dominio diferente)
          ( tail -f /dev/null | nohup ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
              -R 80:127.0.0.1:6080 nokey@localhost.run \
              > "$QEMU_DIR/lhr.log" 2>&1 ) &
          ALT=""
          for i in $(seq 1 15); do
            sleep 2
            ALT="$(grep -oE 'https://[a-zA-Z0-9]+\.lhr\.life' "$QEMU_DIR/lhr.log" | tail -n1)"
            [ -n "$ALT" ] && break
          done
          [ -n "$ALT" ] || ALT="(nao gerado)"

          echo "=============================================="
          echo "  ZORIN GAMER PC"
          echo "  Abra: $URL/vnc.html"
          echo "  Link reserva: $ALT/vnc.html"
          echo "  ${VM_CPUS} vCPU | ${VM_RAM_MB} MB RAM | ${DISK_SIZE} disco | ${ACCEL%%,*}"
          echo "  Disco restaurado do save: ${RESTORED}"
          echo "  PRA SALVAR: desligue o Zorin por dentro (menu > Sair > Desligar)."
          echo "=============================================="

      - name: Keep workflow alive
        run: |
          # se voce cancelar a execucao, ja pede o desligamento na hora
          on_cancel() {
            echo "Cancelamento detectado: pedindo desligamento..."
            touch "$QEMU_DIR/powerdown_sent"
            echo system_powerdown | socat - UNIX-CONNECT:"$QEMU_DIR/monitor.sock" || true
            exit 0
          }
          trap on_cancel INT TERM

          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TS)) -ge "$MAX_SECONDS" ]; then
              echo "Perto do limite de 6h: encerrando e salvando."
              break
            fi
            pgrep -f qemu-system-x86_64 > /dev/null || { echo "VM desligada: indo salvar."; tail -n 30 "$QEMU_DIR/qemu.log" || true; break; }
            pgrep -f cloudflared > /dev/null || { echo "Tunel caiu: encerrando e salvando."; break; }
            sleep 20 & wait $!
          done

      - name: Shutdown VM safely
        if: ${{ always() && env.VM_STARTED == 'true' }}
        run: |
          if pgrep -f qemu-system-x86_64 > /dev/null; then
            if [ ! -f "$QEMU_DIR/powerdown_sent" ]; then
              echo system_powerdown | socat - UNIX-CONNECT:"$QEMU_DIR/monitor.sock" || true
            fi
            for i in $(seq 1 30); do
              pgrep -f qemu-system-x86_64 > /dev/null || break
              sleep 2
            done
            if pgrep -f qemu-system-x86_64 > /dev/null; then
              echo "Nao desligou a tempo: fechando a VM a forca."
              echo quit | socat - UNIX-CONNECT:"$QEMU_DIR/monitor.sock" || true
              sleep 5
            fi
          fi
          pkill -f websockify || true
          pgrep -f qemu-system-x86_64 > /dev/null && echo "AVISO: QEMU ainda ativo" || echo "VM parada."

      - name: Compress disk
        if: ${{ always() && env.VM_STARTED == 'true' }}
        run: |
          if pgrep -f qemu-system-x86_64 > /dev/null; then
            echo "QEMU ainda ativo: nao vou salvar pra nao corromper."
            exit 0
          fi
          mkdir -p "$SAVE_DIR"
          rm -f "$SAVE_DIR/zorin.qcow2.zst"
          # recria o qcow2 so com o que esta em uso (ignora o espaco vazio)
          qemu-img convert -f qcow2 -O qcow2 -o cluster_size=1M \
            "$QEMU_DIR/zorin.qcow2" "$QEMU_DIR/zorin-compact.qcow2"
          zstd -T0 -1 -f "$QEMU_DIR/zorin-compact.qcow2" -o "$SAVE_DIR/zorin.qcow2.zst"
          stat -c%s "$QEMU_DIR/zorin-compact.qcow2" > "$SAVE_DIR/zorin.size"
          ls -lh "$SAVE_DIR/zorin.qcow2.zst"
          SIZE=$(stat -c%s "$SAVE_DIR/zorin.qcow2.zst")
          if [ "$SIZE" -gt 9800000000 ]; then
            echo "ERRO: save com $((SIZE/1000000)) MB passa do limite de 10 GB do cache. Nao vou salvar."
            exit 0
          fi
          echo "SAVE_READY=true" >> "$GITHUB_ENV"

      - name: Save to cache
        id: save
        if: ${{ always() && env.SAVE_READY == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/zorin-save
          key: zorin-disk-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete older saves
        if: ${{ always() && steps.save.outcome == 'success' }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key zorin-disk- \
            --sort created_at --order desc --limit 50 --json id --jq '.[1:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
          echo "Save concluido."
